[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pir-find"
version = "0.1.0.dev0"
description = "Find a closed-form formula in a table with the PIR symbolic-regression engine; command line and MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pir-engine @ git+https://github.com/Qazi-pk/physics-engine.git@v3.10.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = ["pytest"]

[project.scripts]
pir-find = "pir_find.cli:main"
pir-find-mcp = "pir_find.mcp_server:main"

[tool.setuptools]
packages = ["pir_find"]
